name: Aggiorna playlist IPTV

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v5

      - name: Scarica playlist aggiornata
        run: |
          curl -L "https://www.davidefulgione.com/tv.m3u" -o playlist.m3u

      - name: Salva aggiornamento
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add playlist.m3u
          git commit -m "Aggiornamento automatico playlist" || exit 0
          git push
